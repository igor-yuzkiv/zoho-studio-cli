# GENERATED by local/build-index.py — do not edit by hand.
# Source of truth is the frontmatter of the blocks themselves.
#
# An index for selection: what to open. The block's full text is in its own file.

version: 1
blocks:
  rule:
  - id: artifact-routing
    path: rules/artifact-routing.md
    description: Where an artifact goes is a property of the project, never of this catalog.
    binding: mandatory
    use_when: ['producing anything that has to be stored somewhere — a spec, a decision, a note, an update']
  - id: communication-defaults
    path: rules/communication-defaults.md
    description: Anything a human reads leads with the conclusion and names its uncertainty.
    binding: mandatory
    use_when: ['chat replies, task comments, PR descriptions, status updates, documents, client messages']
  - id: decision-authority
    path: rules/decision-authority.md
    description: Autonomy of depth and autonomy of decision are separate. Depth is granted; decisions are not.
    binding: mandatory
    use_when: [any autonomous work]
  - id: definition-of-done
    path: rules/definition-of-done.md
    description: Done means verified and reported, not written. Unverified work is a proposal.
    binding: mandatory
    use_when: [reporting the result of any change]
  - id: delegate-orientation
    path: rules/delegate-orientation.md
    description: Reading to find out is delegated to a subagent. Reading to transform is done here.
    binding: mandatory
    use_when: ['answering a question about a codebase, a body of documents, or how something works']
  - id: evidence-and-claims
    path: rules/evidence-and-claims.md
    description: Separate what was verified from what was inferred, and mark which is which.
    binding: mandatory
    use_when: ['reporting findings, describing how a system behaves, making a recommendation']
  - id: execution-discipline
    path: rules/execution-discipline.md
    description: Do exactly what the task specifies. Report adjacent problems instead of fixing them.
    binding: mandatory
    use_when: [any change to an existing codebase]
  - id: output-discipline
    path: rules/output-discipline.md
    description: A subagent returns conclusions and pointers, never the material it read.
    binding: mandatory
    use_when: [any subagent returning to the main agent, any operation whose result feeds another step]
  principle:
  - id: bluf
    path: principles/bluf.md
    description: Lead with the conclusion, decision, or request. Context and evidence follow.
    binding: guidance
    use_when: [status updates and progress reports, findings from an investigation, proposals and recommendations, documents
        written to get a decision, task comments and handoffs, any answer longer than a few sentences]
    skip_when: [the conclusion only makes sense after a specific piece of context, 'narrative order is the point, as in a
        reproduction sequence or a timeline']
  - id: chestertons-fence
    path: principles/chestertons-fence.md
    description: Do not remove what you do not understand until you know why it is there.
    binding: guidance
    use_when: ['deleting code, a check, a condition, or a configuration whose purpose is unclear', the change touches legacy
        nobody has explained]
  - id: dry
    path: principles/dry.md
    description: Each important piece of knowledge has one primary home; elsewhere, link to it.
    binding: guidance
    use_when: ['the same requirement, decision, or explanation is about to exist in two places']
    skip_when: [two things merely look alike but change for different reasons]
  - id: eli5
    path: principles/eli5.md
    description: Explain complex things in ordinary language without losing meaning.
    binding: guidance
    use_when: [the reader knows the product but was not in the earlier discussions, 'writing for a client, a non-technical
        stakeholder, or your future self']
    skip_when: [the reader is a peer who shares the full context and needs precision more than accessibility]
  - id: kiss
    path: principles/kiss.md
    description: Choose the simplest solution that fully closes the current problem and known requirements.
    binding: guidance
    use_when: [choosing between solution shapes, deciding how much structure a document or plan needs]
    skip_when: [the complexity is already justified by a requirement you can name]
  - id: plain-language
    path: principles/plain-language.md
    description: Describe behaviour rather than implementation, and keep terminology stable.
    binding: guidance
    use_when: ['a document will be read by a mix of client, PM, designer, QA, and developer']
  - id: reference-over-prose
    path: principles/reference-over-prose.md
    description: Point at a real file, test, or signature instead of describing the convention in words.
    binding: guidance
    use_when: ['writing a spec, a handoff, or any instruction someone else will execute', telling an executor how something
        should be shaped]
    skip_when: ['nothing in the codebase does this yet — then the shape is a decision, not a reference']
  - id: self-documenting-code
    path: principles/self-documenting-code.md
    description: Code explains itself through naming and structure; a comment earns its place only by carrying why.
    binding: guidance
    use_when: [writing or changing code]
    skip_when: ['editing generated files, or a codebase whose established style is heavily annotated']
  - id: yagni
    path: principles/yagni.md
    description: Build for the requirement you have, not the one you can imagine.
    binding: guidance
    use_when: ['adding a parameter, hook, layer, or configuration option nobody asked for', a review comment proposes an abstraction
        "for the future"]
    skip_when: ['the second use case is already specified and scheduled, not merely plausible']
  pipeline:
  - id: plan-work
    path: pipelines/plan-work.md
    description: Joint planning — from source material to decisions to task specs someone else can execute.
    use_when: ['the approach is not settled, or the work is large enough to need cutting up', 'execution will happen later,
        or in other sessions']
    skip_when: [the task is ready to execute — that is run-task]
  - id: run-task
    path: pipelines/run-task.md
    description: The default operational cycle — orient, decide how much ceremony the task deserves, execute, verify, review,
      close.
    use_when: [any piece of work that is ready to be executed]
    skip_when: ['the approach is undecided — that is concept work, not execution']
  operation:
  - id: clarify-task
    path: operations/clarify-task.md
    description: Separate what the task states from what it leaves open, and turn the gaps into answerable questions.
    use_when: ['the task came from a client, a ticket, or a conversation rather than a finished spec']
    skip_when: [the task is fully specified and nothing depends on an unstated choice]
  - id: compare-options
    path: operations/compare-options.md
    description: Put two or three genuinely different approaches side by side with their real costs, so a person can choose.
    use_when: ['the shape of the solution is not obvious, or more than one shape would work', a choice has consequences beyond
        this task]
    skip_when: [there is one reasonable approach and naming it is enough]
  - id: decompose-into-tasks
    path: operations/decompose-into-tasks.md
    description: Turn an agreed solution into separately schedulable units of work, each independently verifiable.
    use_when: [a solution has been decided and the work is larger than one sitting, 'work will be executed later, or by someone
        other than whoever planned it']
    skip_when: [the whole thing is one task]
  - id: decompose-into-workstreams
    path: operations/decompose-into-workstreams.md
    description: Split the work into units that can run in parallel without colliding, and fix the contracts they share.
    use_when: [the task is large enough that units could be executed independently]
    skip_when: ['the work is a single coherent change, or units cannot be verified independently']
  - id: implement-change
    path: operations/implement-change.md
    description: Apply a specified change to the codebase, following the project's existing patterns.
    use_when: [the change is specified well enough that no design decision remains open]
    skip_when: [the approach is still undecided — the work belongs in a concept or spec step first]
  - id: orient-in-codebase
    path: operations/orient-in-codebase.md
    description: Return a compressed map of the code relevant to one narrow question.
    use_when: [the change touches code you have not established the shape of]
    skip_when: [the relevant files and their behaviour are already established in this session, the question is "what shape
        should this code take" — read the exemplar directly instead; a map is the wrong output for that]
  - id: record-decision
    path: operations/record-decision.md
    description: Capture a decision as a first-class artifact, so it survives the session that produced it.
    use_when: [a choice was made that will constrain later work, a option was rejected for a reason worth not re-discovering]
    skip_when: [the choice is local to one file and visible in the code itself]
  - id: review-change
    path: operations/review-change.md
    description: Review the diff against the task it was meant to accomplish, with evidence for every finding.
    use_when: [a change is complete and about to be delivered, an independent read of a diff is wanted at any point]
  - id: run-coverage-pass
    path: operations/run-coverage-pass.md
    description: Walk the coverage lenses against the work at hand and turn what is missing into questions, decisions, or
      spec content.
    use_when: [planning anything beyond a trivial change, reviewing a plan or a spec before it is acted on]
    skip_when: ['the change is a one-line fix with no persisted state, no interface, and no consumers']
  - id: verify-change
    path: operations/verify-change.md
    description: Run the checks that actually cover the change and report what they showed.
    use_when: [a change has been made and is about to be reported]
  - id: wrap-up-work
    path: operations/wrap-up-work.md
    description: Turn finished work into a commit, a task update, and whatever the outside world needs to know.
    use_when: ['a change is verified and being handed off, committed, or closed']
  - id: write-task-spec
    path: operations/write-task-spec.md
    description: Produce a specification complete enough that someone with none of this context can execute it without deciding
      anything.
    use_when: ['the work will be done in another session, by another person, or by a weaker model', a task is being filed
        now and executed later]
    skip_when: ['the work is being done immediately, in this context, by whoever planned it']
  coverage:
  - id: backward-compatibility
    path: coverage/backward-compatibility.md
    description: Who already consumes what is being changed, and what breaks for them at the moment of deploy.
    binding: guidance
    use_when: ['an API response, request shape, event payload, or stored format changes', 'something is renamed, removed,
        or made required', a default changes]
    skip_when: [the thing being changed has no consumers outside this change]
  - id: concurrency-and-idempotency
    path: coverage/concurrency-and-idempotency.md
    description: What happens when this runs twice at once, or twice in a row, or is retried after a timeout.
    binding: guidance
    use_when: ['a background job, webhook handler, or scheduled task', anything triggered by a user action that could be repeated,
      a read-then-write sequence on shared data]
    skip_when: [a single-user local operation with no shared state]
  - id: data-migration-and-backfill
    path: coverage/data-migration-and-backfill.md
    description: Whether existing data has to move, change shape, or be filled in — and what happens to the rows that do not
      fit.
    binding: guidance
    use_when: ['a schema, a stored shape, or the meaning of an existing field changes', a new required field is added to something
        that already has rows, data starts being written somewhere it was not written before]
    skip_when: [nothing persisted changes shape or meaning]
  - id: edge-cases-and-data-variants
    path: coverage/edge-cases-and-data-variants.md
    description: The shapes of input that exist in reality but not in the example everyone reasoned from.
    binding: guidance
    use_when: ['any logic that processes user data, imported data, or historical records']
    skip_when: [the input space is genuinely closed and fully enumerated]
  - id: error-behavior
    path: coverage/error-behavior.md
    description: What the user sees and what the system does when this fails — stated per failure, not as "handle errors".
    binding: guidance
    use_when:
    - {the work calls anything that can fail: 'network, database, filesystem, queue, third party'}
    - a multi-step operation can fail partway
    skip_when: [the change cannot fail in any way the caller would notice]
  - id: observability
    path: coverage/observability.md
    description: How anyone finds out that this works, or has stopped working, once it is in production.
    binding: guidance
    use_when: ['a background job, integration, scheduled task, or anything that runs unattended', a path that can fail without
        a user noticing immediately]
    skip_when: [a synchronous user-facing action whose failure the user sees instantly]
  - id: performance-at-real-volume
    path: coverage/performance-at-real-volume.md
    description: Whether this still works when the data is the size it actually is, not the size it is in development.
    binding: guidance
    use_when: ['a list, report, export, import, or anything iterating over records', 'a query inside a loop, or a loop inside
        a request']
    skip_when: ['the operation touches a bounded, genuinely small set']
  - id: permissions-and-authorization
    path: coverage/permissions-and-authorization.md
    description: Who may see and do this, where the check actually sits, and what changes for roles that already exist.
    binding: guidance
    use_when: ['a new endpoint, action, page, or data set appears', existing data becomes visible somewhere new, 'a role,
        scope, or ownership rule changes']
    skip_when: [nothing user-facing or data-reaching changes]
  - id: rollback-and-recovery
    path: coverage/rollback-and-recovery.md
    description: How this is undone if it turns out badly in production — and whether undoing it is even possible.
    binding: guidance
    use_when: ['a migration, a backfill, a contract change, or anything touching stored data', a change that is deployed rather
        than merely merged]
    skip_when: ['the change is additive, isolated, and reverting the code is genuinely enough']
  - id: side-effects
    path: coverage/side-effects.md
    description: What else fires when this runs — events, observers, jobs, notifications, cache, webhooks.
    binding: guidance
    use_when: ['a record is created, updated, or deleted', a status or state transition is added or changed, anything is written
        that other code watches]
    skip_when: [the change is read-only and emits nothing]
  - id: test-strategy
    path: coverage/test-strategy.md
    description: Which scenarios are checked and at which level — decided before the code exists, not after.
    binding: guidance
    use_when: [planning any change large enough to have more than one behaviour]
    skip_when: [the project has no tests and adding the first one is out of scope]
  - id: ui-states
    path: coverage/ui-states.md
    description: The interface states that exist in reality and get forgotten in the design — loading, empty, error, forbidden,
      partial.
    binding: guidance
    use_when: ['a page, view, list, form, or component that shows data or accepts input']
    skip_when: [no user interface is involved]
