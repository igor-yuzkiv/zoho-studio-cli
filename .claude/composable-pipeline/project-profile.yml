# Project profile
#
# A lookup table for the steps that need it — not a description of the project.
# Project rules and architecture live in .claude/rules/, which is always in context.
#
# No secrets, no absolute paths. See the plugin template for the reasoning.

artifacts:
  progress_update: project-office
  client_update: none
  test_plan: project-office:comments
  workflow_record: project-office
  list_flow: project-office
  coverage_pass:
  options:
  architecture:

language:
  chat: Ukrainian
  code: English
  git: English
  repo_docs: English
  office_docs: Ukrainian
  tasks: Ukrainian
  client_docs: none
  client_messages: none
  local_notes: Ukrainian

task_labels:
  - CLI
  - DOC
  - SKILL

exemplars:
  command: apps/cli/src/zoho-crm/commands/fields/pull-fields.command.ts
  service: apps/cli/src/commands/init/init.service.ts
  request: packages/zoho-crm/src/entities/field/api/get-fields-list.request.ts
  client: packages/zoho-crm/src/api/crm.client.ts
  entity_types: packages/zoho-crm/src/entities/field/field.types.ts
  settings: packages/core/src/settings/settings.store.ts
  utils: packages/core/src/utils/cli.utils.ts
  test_command: tests/cli/commands/init.service.spec.ts
  test_unit: tests/core/settings/settings.loader.spec.ts
  test_fixture: tests/support/temp-project.ts
  docs_page: docs/8-fields-pull-command.md

verification:
  tests: bun test
  tests_filtered: bun test <path-to-spec>
  lint: bun run lint
  types: bun run typecheck
  build: bun run build
  all: bun run check
